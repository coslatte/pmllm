services:

  #######################
  ### MILVUS SERVICES ###
  #######################
  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - pmllm-net

  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:latest
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "19001:9001"
      - "19000:9000"
    volumes:
      - ./data/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - pmllm-net

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:latest
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./data/milvus/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "10000:10001"
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - pmllm-net

  ###############################
  ### USER CHAT DATABASE (PG) ###
  ###############################

  user-db:
    container_name: pmllm-user-db
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME:-pmllm_chat}
      POSTGRES_USER: ${CHAT_DB_USER:-pmllm}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-pmllm}
    ports:
      - "${CHAT_DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${CHAT_DB_USER:-pmllm} -d ${CHAT_DB_NAME:-pmllm_chat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pmllm-net

  ###############################
  ### CHAT & PREFERENCE STORE ###
  ###############################

  recommender-api:
    container_name: pmllm-recommender-api
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      CHAT_DB_PATH: /app/storage/local_app.db
      CHAT_DB_URL: ${CHAT_DB_URL:-postgresql+psycopg2://pmllm:pmllm@pmllm-user-db:5432/pmllm_chat}
      LLM_API_URL: http://gemma-chat:8080/v1/chat/completions
      EMBEDDING_API_URL: http://gemma-embeddings:8080/v1/embeddings
    ports:
      - "8080:8080"
    depends_on:
      - milvus-standalone
      - gemma-chat
      - gemma-embeddings
      - user-db
    volumes:
      - ./data/chat_storage:/app/storage
    networks:
      - pmllm-net

  gemma-chat:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gemma-chat
    ports:
      - "8082:8080"
    volumes:
      - D:\Coding\AiModels\lmstudio-community\gemma-3-1B-it-QAT-GGUF:/models
    command: >
      -m /models/gemma-3-1B-it-QAT-Q4_0.gguf
      --host 0.0.0.0
      --port 8080
      -t 4
      -c 2048
    restart: unless-stopped
    networks:
      - pmllm-net

  gemma-embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gemma-embeddings
    ports:
      - "8081:8080"
    volumes:
      - D:\Coding\AiModels\lmstudio-community\embeddinggemma-300m-qat-GGUF:/models
    command: >
      -m /models/embeddinggemma-300m-qat-Q4_0.gguf
      --host 0.0.0.0
      --port 8080
      --embedding
      -t 8
      -c 2048
      -np 4
      -cb
    restart: unless-stopped
networks:
  pmllm-net:
    driver: bridge
