services:

  #######################
  ### MILVUS SERVICES ###
  #######################
  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - pmllm-net

  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:latest
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "19001:9001"
      - "19000:9000"
    volumes:
      - ./data/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - pmllm-net

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:latest
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./data/milvus/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - pmllm-net

  ###########################
  ### MODEL GATEWAY STACK ###
  ###########################

  model-gateway:
    container_name: pmllm-model-gateway
    build:
      context: .
      dockerfile: model_gateway/Dockerfile
    env_file:
      - .env
    environment:
      MODEL_GATEWAY_EMBEDDING_MODEL: ${MODEL_GATEWAY_EMBEDDING_MODEL:-text-embedding-embeddinggemma-300m-qat}
      MODEL_GATEWAY_LLM_MODEL: ${MODEL_GATEWAY_LLM_MODEL:-gemma-3-1b-it-qat}
      MODEL_GATEWAY_DEVICE: ${MODEL_GATEWAY_DEVICE:-cpu}
    ports:
      - "9000:9000"
    volumes:
      - ./data/model_gateway/cache:/root/.cache/huggingface
    networks:
      - pmllm-net

  ###############################
  ### CHAT & PREFERENCE STORE ###
  ###############################

  recommender-api:
    container_name: pmllm-recommender-api
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      CHAT_DB_PATH: /app/storage/local_app.db
      LLM_API_URL: http://pmllm-model-gateway:9000/v1/chat/completions
      EMBEDDING_API_URL: http://pmllm-model-gateway:9000/v1/embeddings
    ports:
      - "8080:8080"
    depends_on:
      - milvus-standalone
      - model-gateway
    volumes:
      - ./data/chat_storage:/app/storage
    networks:
      - pmllm-net

networks:
  pmllm-net:
    driver: bridge
